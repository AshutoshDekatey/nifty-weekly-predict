[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-five-session-ml"
version = "0.3.0"
description = "Leakage-aware NIFTY five-session market-direction research app"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "curl-cffi>=0.7,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=14,<25",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.50,<2",
  "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
